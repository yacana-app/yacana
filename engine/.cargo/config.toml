# Android 15+ devices with 16 KB memory pages need 16 KB aligned ELF segments
# (ARCHITECTURE.md). tools/check_16kb.py verifies it in CI.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
